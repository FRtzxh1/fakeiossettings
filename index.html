<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settings</title>
<style>
:root{--f:1;--bg:#f2f2f7;--card:#fff;--tx:#000;--sub:#8e8e93;--sep:#d1d1d6;--press:#e5e5ea;--blue:#0a84ff;--bar:rgba(242,242,247,.8);box-sizing:border-box;padding-top:max(env(safe-area-inset-top,0px),10px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#000;--card:#1c1c1e;--tx:#fff;--sub:#8e8e93;--sep:#38383a;--press:#2c2c2e;--bar:rgba(0,0,0,.7)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#000;--card:#1c1c1e;--tx:#fff;--sub:#8e8e93;--sep:#38383a;--press:#2c2c2e;--bar:rgba(0,0,0,.7)}
html,body{height:100%;margin:0;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:var(--tx);-webkit-tap-highlight-color:transparent;user-select:none;overflow:hidden}
#app{position:relative;height:100%;max-width:430px;margin:0 auto;overflow:hidden;background:var(--bg)}
.page{position:absolute;inset:0;background:var(--bg);transition:transform .38s cubic-bezier(.32,.72,0,1),opacity .38s;will-change:transform}
.page.in{transform:translateX(100%)}.page.back{transform:translateX(-28%);opacity:.6}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:0 16px 130px;-webkit-overflow-scrolling:touch}
.nav{position:absolute;top:0;left:0;right:0;height:44px;z-index:5;display:flex;align-items:center;justify-content:center;background:transparent;transition:background .2s}
.nav.s{background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 .5px 0 var(--sep)}
.nav b{font-size:calc(19px*var(--f));font-weight:700;opacity:0;transition:opacity .2s}.nav.s b{opacity:1}
.bk{position:absolute;left:12px;top:0;width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s}
.bk:active{transform:scale(.88)}
h1{font-size:calc(34px*var(--f));font-weight:700;margin:0;padding:54px 4px 8px;letter-spacing:.3px}
.card{background:var(--card);border-radius:26px;margin:0 0 35px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;min-height:53px;padding:0 14px 0 13px;cursor:pointer;transition:background .15s,opacity .3s}
.row:active{background:var(--press);transition:none}
.row+.row::before{content:"";position:absolute;top:0;left:53px;right:0;height:.5px;background:var(--sep)}
.row.nl{cursor:default}.row.nl:active{background:none}
.ic{width:28px;height:28px;border-radius:22%;margin-right:12px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ic img{width:100%;height:100%;display:block}
.ic svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2}
.l{flex:1;font-size:calc(17px*var(--f));padding:14px 0}.v{color:var(--sub);font-size:calc(17px*var(--f));margin-right:6px;text-align:right}
.ch{width:8px;height:14px;flex:none;stroke:var(--sub);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.dim .l,.dim .v{opacity:.45}
.tg{width:51px;height:31px;border-radius:16px;background:#78788033;position:relative;flex:none;cursor:pointer;transition:background .25s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px #0004;transition:transform .25s cubic-bezier(.4,0,.2,1),width .15s}
.tg:active::after{width:33px}.tg.on{background:#30d158}.tg.on::after{transform:translateX(20px)}.tg.on:active::after{transform:translateX(14px)}
.prof{padding:16px 14px 0 17px}.prof .row{padding:0;min-height:0}.prof .row+.row::before{left:0}
.av{width:60px;height:60px;border-radius:50%;background:linear-gradient(#a8bfe4,#7b86c9);display:flex;align-items:center;justify-content:center;margin-right:13px;flex:none}
.av svg{width:34px;fill:#fff}
.pn b{font-size:calc(20px*var(--f));display:block}.pn span{font-size:calc(15px*var(--f));color:var(--sub)}
.bd{min-width:21px;height:21px;border-radius:11px;background:#ff3b30;color:#fff;font-size:calc(15px*var(--f));display:flex;align-items:center;justify-content:center;margin-right:10px;font-weight:500}
#ic{transition:max-height .4s,opacity .3s;max-height:90px;overflow:hidden}.gone{max-height:0!important;opacity:0}
.hint{color:var(--sub);font-size:calc(13px*var(--f));padding:0 16px 30px;margin-top:-22px;line-height:1.35}
.sh{color:var(--sub);font-size:calc(13px*var(--f));text-transform:uppercase;padding:0 16px 7px;margin-top:-4px}
.ck{width:18px;height:18px;stroke:var(--blue);fill:none;stroke-width:2.6;opacity:0;margin-right:4px;transition:opacity .15s}.sel .ck{opacity:1}
.btn{display:block;width:100%;background:var(--card);color:var(--blue);font-size:calc(17px*var(--f));border:0;border-radius:26px;height:53px;cursor:pointer;margin-bottom:20px;transition:transform .15s,opacity .15s}.btn:active{transform:scale(.97);opacity:.6}
.sp{width:18px;height:18px;border:2.5px solid var(--sub);border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;margin-right:6px}@keyframes r{to{transform:rotate(360deg)}}
.big{text-align:center;padding:30px 0 24px;font-size:calc(54px*var(--f));font-weight:700}
.bar{height:10px;background:var(--press);border-radius:5px;margin:0 16px 18px;overflow:hidden}.bar i{display:block;height:100%;background:#30d158;border-radius:5px;transition:width .5s,background .3s}
#sb{position:absolute;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));height:48px;border-radius:24px;background:var(--bar);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 4px 18px #0003,inset 0 0 0 .5px #8884;display:flex;align-items:center;padding:0 14px;gap:9px;z-index:9;transition:transform .35s cubic-bezier(.32,.72,0,1),opacity .3s}
#sb.h{transform:translateY(90px);opacity:0;pointer-events:none}
#sb input{flex:1;background:none;border:0;outline:0;color:var(--tx);font-size:calc(21px*var(--f));min-width:0;user-select:text;font-family:inherit}
#sb input::placeholder{color:var(--sub)}#sb svg{width:22px;height:22px;flex:none;stroke:var(--tx);fill:none;stroke-width:2.4;stroke-linecap:round}
.none{text-align:center;color:var(--sub);padding:40px;display:none}

:root{--gt:rgba(120,120,128,.2);--gh:rgba(255,255,255,.26);--gs:rgba(0,0,0,.28)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--gt:rgba(255,255,255,.2);--gh:rgba(255,255,255,.68);--gs:rgba(0,0,0,.14)}}
#sb,.bk,.bk2{background:var(--gt);backdrop-filter:blur(4px) saturate(150%);-webkit-backdrop-filter:blur(4px) saturate(150%);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.21),inset 1px 1px 1px -.5px var(--gh),0 4px 14px var(--gs)}
#sb::before,.bk::before,.bk2::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;background:radial-gradient(120px 40px at var(--mx,25%) 0,rgba(255,255,255,.52),transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.tg{width:64px;height:28px;border-radius:14px;margin-right:-1px}
.tg::after{top:2px;left:2px;width:37px;height:24px;border-radius:12px;background:linear-gradient(#fff,#ececec);box-shadow:0 2px 6px #0005,inset 0 0 0 .5px #fff9,inset 0 1px 1px #fff}
.tg.on::after{transform:translateX(23px)}.tg:active::after{width:42px}.tg.on:active::after{transform:translateX(18px)}
.card:not([data-g]) .row:not(:has(.ic)){padding-left:16px;padding-right:16px}.card:not([data-g]) .row:not(:has(.ic))+.row::before{left:16px}
.bk2{position:absolute;right:12px;top:0;width:104px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(17px*var(--f));cursor:pointer;color:var(--tx);transition:transform .2s}.bk2:active{transform:scale(.92)}
.wck{width:26px;flex:none;display:flex;align-items:center}.wi{width:22px;height:22px;color:var(--tx);margin-left:12px;flex:none}.wi.in{width:28px;height:28px;color:#0a84ff;margin-left:14px}
.sh2{color:var(--sub);font-weight:600;font-size:calc(17px*var(--f));line-height:20px;padding:0 16px 7px}
.ed{-webkit-user-select:text;user-select:text;outline:1.5px solid #0a84ff;outline-offset:2px;border-radius:4px;caret-color:#0a84ff}
.tin{-webkit-user-select:text;user-select:text;background:none;border:0;outline:0;color:#30d158;font:inherit;flex:1;min-width:0}
body{-webkit-touch-callout:none}
.card:not([data-g]) .row.wr:not(:has(.ic))+.row.wr::before{left:42px}
body{touch-action:manipulation}
